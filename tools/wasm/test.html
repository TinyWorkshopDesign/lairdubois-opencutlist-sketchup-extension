<!doctype html>
<meta charset="utf-8">
<title>OpenCutList wasm test</title>
<pre id="log">running…</pre>
<script type="module">
const log = (s) => {
  document.getElementById('log').textContent += '\n' + s;
  fetch('/log?' + encodeURIComponent(s)).catch(() => {});
};
try {
  log('crossOriginIsolated: ' + self.crossOriginIsolated);

  const { default: createClippy } = await import('./clippy.js');
  const c = await createClippy();
  const sq = [4, 0, 0, 0, 10, 0, 10, 10, 0, 10];
  const p = c._malloc(sq.length * 8); c.HEAPF64.set(sq, p / 8);
  log('clippy area: ' + Math.abs(c._c_get_cpath_area(p)));

  const { default: createMeshy } = await import('./meshy.js');
  const me = await createMeshy();
  const box = ([x0, y0, z0], [x1, y1, z1]) => {
    const v = [];
    for (const z of [z0, z1]) for (const y of [y0, y1]) for (const x of [x0, x1]) v.push(x, y, z);
    const q = [[0, 2, 3, 1], [4, 5, 7, 6], [0, 1, 5, 4], [2, 6, 7, 3], [0, 4, 6, 2], [1, 3, 7, 5]];
    return { vertices: v, face_indices: q.flatMap(([a, b, c, d]) => [a, b, c, a, c, d]) };
  };
  const mi = me.stringToNewUTF8(JSON.stringify({ operation: 'union', src_meshes: [box([0, 0, 0], [10, 10, 10])], cut_meshes: [box([5, 5, 5], [15, 15, 15])] }));
  const mo = JSON.parse(me.UTF8ToString(me._c_operate(mi)));
  log(`meshy union: ${mo.error ?? 'ok'}, ${mo.fragments?.length} fragment, ${mo.fragments?.[0]?.num_faces} triangles`);
  const meshyOk = mo.fragments?.length === 1;

  const { default: createImagy } = await import('./imagy.js');
  const im = await createImagy();
  log('imagy: version ' + im.UTF8ToString(im._c_version()) + ', FS ' + (typeof im.FS.writeFile));

  const { default: createPacky } = await import('./packy.js');
  const m = await createPacky();
  const mm = (v) => v / 25.4;
  const input = m.stringToNewUTF8(JSON.stringify({
    problem_type: 'rectangleguillotine',
    parameters: { length_truncate_factor: 254, optimization_mode: 'not-anytime-deterministic', not_anytime_tree_search_queue_size: 16, verbosity_level: 0 },
    instance: {
      objective: 'bin-packing-with-leftovers',
      parameters: { cut_type: 'non-exact', cut_thickness: mm(3.2), number_of_stages: 3, first_stage_orientation: 'horizontal' },
      bin_types: [{ copies: 10, width: mm(2800), height: mm(2070), cost: 1 }],
      item_types: [[600, 400, 6], [720, 560, 4], [1200, 300, 2]].map(([l, w, n]) => ({ copies: n, width: mm(l), height: mm(w), oriented: false })),
    },
  }));
  const run = JSON.parse(m.UTF8ToString(m._c_optimize_start(input)));
  const t0 = performance.now();
  let out;
  do {
    await new Promise((r) => setTimeout(r, 50));
    out = JSON.parse(m.UTF8ToString(m._c_optimize_advance(run.run_id)));
  } while (out.running && performance.now() - t0 < 30000);
  const sol = out.solution;
  const placed = sol ? sol.bins.reduce((s, b) => s + b.copies * b.items.length, 0) : 0;
  log(`packy: ${out.error ?? 'ok'}, ${placed}/12 parts, ${Math.round(performance.now() - t0)} ms`);
  log(placed === 12 && meshyOk ? 'RESULT: PASS' : 'RESULT: FAIL');
} catch (e) {
  log('RESULT: FAIL ' + e);
}
</script>
